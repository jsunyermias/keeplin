name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    # `edited` and `ready_for_review` are not in the default set. Without them the
    # review-independence gate can never clear: filling the waiver block edits the
    # body, and a re-run replays the original payload with the body it had before.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Contractual docs: every .rs has a companion .md and every companion
      # carries a `## Graph context` section (the two-layer navigation model).
      - name: Check companion docs
        run: ./scripts/check-docs.sh

      - name: Test companion tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler

      - name: cargo fmt (workspace)
        run: cargo fmt --check --all

      - name: cargo test (keeplin-core)
        run: cargo test -p keeplin-core

      - name: cargo test (keeplin-daemon)
        run: cargo test -p keeplin-daemon

      # --all-targets lints test and bench code too, matching the command the README
      # tells contributors to run locally. It also fully subsumes `cargo check`.
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Prebuilt binary instead of `cargo install cargo-audit` — compiling the tool
      # from source added minutes to every run for no additional coverage.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  review:
    # Like the graph job below, this name is a branch-protection required-check
    # identifier. It only gates merges once it is added to the required list in
    # Settings -> Branches of both repositories; until then it reports without
    # blocking, which is the intended way to land it.
    name: Review independence declared
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The body is untrusted text written by whoever opened the pull request, so it
      # reaches the script through an environment variable and a file — never through
      # shell interpolation, which would execute whatever a body chose to contain.
      - name: Capture the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Check review independence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.event.repository.name }}
        run: |
          python3 scripts/companion_tool.py review-gate \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --repo "$PR_REPO" \
            --number "$PR_NUMBER"

  graph:
    # This name is the branch-protection required-check identifier. Renaming it
    # makes protection wait forever for a check nobody reports, silently blocking
    # every PR with no red signal. Change it only together with the required-check
    # list in Settings -> Branches of both repositories.
    name: Knowledge graph up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so every CI artifact is generated with the same extractor version.
      - name: Install graphify
        run: python -m pip install --quiet "graphifyy==0.9.25"

      - name: Generate and validate knowledge graph
        env:
          GRAPHIFY_REQUIRED: "1"
        run: ./scripts/check-graph.sh

      - name: Publish knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
