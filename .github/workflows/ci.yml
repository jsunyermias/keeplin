name: CI

on:
  # `claude/**` is deliberately absent. A push run and a pull-request run publish the
  # same `Check, Test & Lint` check for the same commit, and the push run skips the
  # governance step — so a governance failure could be overwritten by a later green.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test pull-request governance check
        run: node --test .github/scripts/check-review-governance.test.js

      - name: Cap open review debt
        run: ./scripts/check-review-debt.sh
        env:
          MAX_OPEN_REVIEW_DEBT: "2"

      - name: Check pull-request review governance
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execSync } = require('node:child_process');
            const {
              DEBT_PATH,
              evaluateReviewGovernance,
            } = require('./.github/scripts/check-review-governance.js');

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(file => file.filename),
            );
            // Maintainer comments carrying the sequential-exception phrases.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(c => ({ id: c.id, body: c.body || '' })),
            );

            // Every `// md:` marker that actually exists, so a fabricated one fails.
            const repoMarkers = execSync(
              "grep -rho '// md:.*' --include='*.rs' . | sed 's/[[:space:]]*$//' | sort -u",
              { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 },
            ).split('\n').map(s => s.trim()).filter(Boolean);

            const touchesCode = changedFiles.some(f => /\.(rs|sh|sql|py)$/.test(f));

            const debtContent = fs.existsSync(DEBT_PATH)
              ? fs.readFileSync(DEBT_PATH, 'utf8')
              : '';
            const result = evaluateReviewGovernance({
              body: context.payload.pull_request.body || '',
              changedFiles,
              debtContent,
              comments,
              repoMarkers,
              touchesCode,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullNumber: context.issue.number,
            });

            core.info(result.message);
            if (!result.ok) core.setFailed(result.message);

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Contractual docs: every .rs has a companion .md and every companion
      # carries a `## Graph context` section (the two-layer navigation model).
      - name: Check companion docs
        run: ./scripts/check-docs.sh

      - name: Test companion tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler

      - name: cargo fmt (workspace)
        run: cargo fmt --check --all

      - name: cargo test (keeplin-core)
        run: cargo test -p keeplin-core

      - name: cargo test (keeplin-daemon)
        run: cargo test -p keeplin-daemon

      # --all-targets lints test and bench code too, matching the command the README
      # tells contributors to run locally. It also fully subsumes `cargo check`.
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Prebuilt binary instead of `cargo install cargo-audit` — compiling the tool
      # from source added minutes to every run for no additional coverage.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  graph:
    # This name is the branch-protection required-check identifier. Renaming it
    # makes protection wait forever for a check nobody reports, silently blocking
    # every PR with no red signal. Change it only together with the required-check
    # list in Settings -> Branches of both repositories.
    name: Knowledge graph up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so every CI artifact is generated with the same extractor version.
      - name: Install graphify
        run: python -m pip install --quiet "graphifyy==0.9.25"

      - name: Generate and validate knowledge graph
        env:
          GRAPHIFY_REQUIRED: "1"
        run: ./scripts/check-graph.sh

      - name: Publish knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
