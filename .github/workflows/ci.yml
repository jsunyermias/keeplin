name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  checks: read
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove pull-request token cannot rewrite check runs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs
        run: |
          get_status=$(curl --silent --show-error --output /tmp/check-runs-response --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${CHECKS_URL}")
          test "${get_status}" = 200
          check_id=$(jq -r '.check_runs[] | select(.name == "Check, Test & Lint") | .id' /tmp/check-runs-response | head -n1)
          test -n "${check_id}"
          status=$(curl --silent --output /tmp/check-patch-response --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${CHECKS_URL%/commits/*}/check-runs/${check_id}" \
            -d '{"output":{"title":"permission canary","summary":"must be forbidden"}}')
          test "${status}" = 403

      - name: Check pull-request review governance
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {
              DEBT_PATH,
              evaluateReviewGovernance,
            } = require('./.github/scripts/check-review-governance.js');

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(file => file.filename),
            );
            const debtContent = fs.existsSync(DEBT_PATH)
              ? fs.readFileSync(DEBT_PATH, 'utf8')
              : '';
            const result = evaluateReviewGovernance({
              body: context.payload.pull_request.body || '',
              changedFiles,
              debtContent,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullNumber: context.issue.number,
            });

            core.info(result.message);
            if (!result.ok) core.setFailed(result.message);

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine filesystem format policy range
        id: format-policy-range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -eu
          case "${EVENT_NAME}" in
            pull_request)
              base="${PR_BASE_SHA}"
              head="${PR_HEAD_SHA}"
              ;;
            push)
              head="${EVENT_SHA}"
              if [ "${GIT_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
                base="${EVENT_BEFORE}"
                case "${base}" in
                  ''|0000000000000000000000000000000000000000)
                    echo "Cannot determine the previous default-branch commit" >&2
                    exit 1
                    ;;
                esac
              else
                default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
                git rev-parse --verify "${default_ref}^{commit}" >/dev/null
                base=$(git merge-base "${head}" "${default_ref}")
                test -n "${base}"
              fi
              ;;
            *)
              echo "Unsupported event for filesystem format policy: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git rev-parse --verify "${head}^{commit}" >/dev/null
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"

      - name: Check filesystem format policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORMAT_POLICY_BASE: ${{ steps.format-policy-range.outputs.base }}
          FORMAT_POLICY_HEAD: ${{ steps.format-policy-range.outputs.head }}
          FORMAT_POLICY_ROOT: ${{ github.workspace }}
        run: |
          set -eu
          policy_path="scripts/check-filesystem-format-policy.py"
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          policy_runner="${RUNNER_TEMP}/check-filesystem-format-policy.py"
          if git cat-file -e "${default_ref}:${policy_path}" 2>/dev/null; then
            git show "${default_ref}:${policy_path}" > "${policy_runner}"
            echo "Using filesystem-format policy from ${default_ref}."
          else
            if git cat-file -e "${FORMAT_POLICY_BASE}:${policy_path}" 2>/dev/null; then
              echo "Default branch lacks the filesystem-format policy although the comparison base contains it; refusing non-bootstrap fallback." >&2
              exit 1
            fi
            test -f "${policy_path}"
            cp "${policy_path}" "${policy_runner}"
            echo "BOOTSTRAP: default branch has no filesystem-format policy; executing the introducing head copy."
          fi
          python3 "${policy_runner}"

      # Contractual docs: every .rs has a companion .md and every companion
      # carries a `## Graph context` section (the two-layer navigation model).
      - name: Check companion docs
        run: ./scripts/check-docs.sh

      - name: Test companion tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y protobuf-compiler

      - name: cargo fmt (workspace)
        run: cargo fmt --check --all

      - name: cargo test (keeplin-core)
        run: cargo test -p keeplin-core

      - name: cargo test (keeplin-daemon)
        run: cargo test -p keeplin-daemon

      # --all-targets lints test and bench code too, matching the command the README
      # tells contributors to run locally. It also fully subsumes `cargo check`.
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Prebuilt binary instead of `cargo install cargo-audit` — compiling the tool
      # from source added minutes to every run for no additional coverage.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      # Runs last on purpose: a governance regression should not abort the job before
      # docs, cargo and audit have reported what else is green.
      - name: Test pull-request governance checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test \
            .github/scripts/check-review-governance.test.js \
            .github/scripts/check-review-loop.test.js

  graph:
    # This name is the branch-protection required-check identifier. Renaming it
    # makes protection wait forever for a check nobody reports, silently blocking
    # every PR with no red signal. Change it only together with the required-check
    # list in Settings -> Branches of both repositories.
    name: Knowledge graph up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so every CI artifact is generated with the same extractor version.
      - name: Install graphify
        run: python -m pip install --quiet "graphifyy==0.9.25"

      - name: Generate and validate knowledge graph
        env:
          GRAPHIFY_REQUIRED: "1"
        run: ./scripts/check-graph.sh

      - name: Publish knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
