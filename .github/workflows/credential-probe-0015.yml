name: ADR 0015 credential probe

on:
  push:
    branches: [claude/credential-probe-0015]
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    name: Probe collaborators endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Query every collaborator page
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ github.token }}
          script: |
            let httpStatus = null;
            let paginationExhausted = false;
            let principalCount = 0;
            let page = 1;

            try {
              while (true) {
                const response = await github.request('GET /repos/{owner}/{repo}/collaborators', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  affiliation: 'all',
                  per_page: 100,
                  page,
                });
                httpStatus = response.status;
                principalCount += response.data.length;

                if (!response.headers.link || !response.headers.link.includes('rel="next"')) {
                  paginationExhausted = true;
                  break;
                }
                page += 1;
              }
            } catch (error) {
              httpStatus = error.status || 'unknown';
              if (httpStatus !== 403) {
                core.setFailed(`Unexpected collaborators endpoint failure: ${error.message}`);
              }
            }

            await core.summary
              .addHeading('ADR 0015 credential probe')
              .addTable([
                [{ data: 'Measurement', header: true }, { data: 'Result', header: true }],
                ['HTTP status', String(httpStatus)],
                ['Pagination exhausted', String(paginationExhausted)],
                ['Principals returned', String(principalCount)],
              ])
              .write();

            core.info(`HTTP status: ${httpStatus}`);
            core.info(`Pagination exhausted: ${paginationExhausted}`);
            core.info(`Principals returned: ${principalCount}`);
