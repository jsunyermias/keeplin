[package]
name = "keeplin-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
keeplin-core = { path = "../keeplin-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true

tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
subtle = "2"

# REST + WebSocket surfaces. axum 0.7 runs on hyper 1.x, the same major as tonic 0.12,
# so the gRPC and HTTP servers share one dependency tree.
axum = { version = "0.7", features = ["ws"] }

# In-process SQLite (FTS5) for the daemon's full-text search index. Same major
# as keeplin-core's store; the index is separate and in-memory. Default features
# are disabled (as in keeplin-core) so the remote-replication stack — and its old
# hyper-rustls/rustls with the RUSTSEC-2026 rustls-webpki advisories — is not
# pulled in; only local `Builder::new_local` is needed.
libsql = { version = "0.6", default-features = false, features = ["core"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
